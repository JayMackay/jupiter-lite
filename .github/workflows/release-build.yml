name: Build release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

# Build jobs run dependency and build scripts, so they only read the repository.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # Update signing: the TAURI_SIGNING_PRIVATE_KEY secret (given only to the build steps) and the
  # TAURI_UPDATER_PUBKEY variable. Without them a release still builds but cannot auto-update apps.
  UPDATER_SIGNING: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
  TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}

jobs:
  linux:
    name: Linux binary and AppImage
    # Keep the glibc baseline stable instead of inheriting newer runner images.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install Linux packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential file libssl-dev libwebkit2gtk-4.1-dev libappindicator3-dev libxdo-dev librsvg2-dev libwayland-dev patchelf squashfs-tools

      - run: npm ci

      - name: Set package version from release tag
        run: node scripts/release-config.mjs "${RELEASE_TAG}"

      - name: Prepare AppImage launcher permissions
        run: node scripts/prepare-appimage.mjs

      - name: Build AppImage and binary
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm exec -- tauri build --ci --bundles appimage --config src-tauri/release-config.json

      - name: Check final AppImage permissions and bundled runtime
        run: |
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          [ "${#images[@]}" -eq 1 ] || { echo "Expected one AppImage" >&2; exit 1; }
          python3 scripts/check-appimage.py "${images[0]}"

      - name: Stage Linux assets
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/jupiter "release-assets/Jupiter-Lite-${RELEASE_TAG}-linux-x86_64"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "release-assets/Jupiter-Lite-${RELEASE_TAG}-x86_64.AppImage"
          for sig in src-tauri/target/release/bundle/appimage/*.AppImage.sig; do [ -f "$sig" ] && cp "$sig" "release-assets/Jupiter-Lite-${RELEASE_TAG}-x86_64.AppImage.sig"; done
          file release-assets/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows installer and binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: npm ci

      - name: Set package version from release tag
        shell: pwsh
        run: node scripts/release-config.mjs "$env:RELEASE_TAG"

      - name: Build NSIS installer and binary
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm exec -- tauri build --ci --bundles nsis --config src-tauri/release-config.json

      - name: Stage Windows assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "release-assets/Jupiter-Lite-$env:RELEASE_TAG-windows-x64-setup.exe"
          $sig = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe.sig -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) { Copy-Item $sig.FullName "release-assets/Jupiter-Lite-$env:RELEASE_TAG-windows-x64-setup.exe.sig" }
          Copy-Item src-tauri/target/release/jupiter.exe "release-assets/Jupiter-Lite-$env:RELEASE_TAG-windows-x64.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: npm ci

      - name: Set package version from release tag
        run: node scripts/release-config.mjs "${RELEASE_TAG}"

      # Asking only for dmg makes Tauri remove the intermediate .app, which
      # the next step also needs for the downloadable app archive.
      - name: Build app and DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm exec -- tauri build --ci --bundles app,dmg --config src-tauri/release-config.json

      - name: Verify the app's code signature
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/*.app

      - name: Stage macOS assets
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/dmg/*.dmg "release-assets/Jupiter-Lite-${RELEASE_TAG}-macos.dmg"
          ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/*.app "release-assets/Jupiter-Lite-${RELEASE_TAG}-macos.app.zip"
          for archive in src-tauri/target/release/bundle/macos/*.app.tar.gz; do
            [ -f "$archive" ] || continue
            cp "$archive" "release-assets/Jupiter-Lite-${RELEASE_TAG}-macos.app.tar.gz"
            cp "$archive.sig" "release-assets/Jupiter-Lite-${RELEASE_TAG}-macos.app.tar.gz.sig"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Write the updater manifest (latest.json)
        run: node scripts/updater-manifest.mjs release-assets "${RELEASE_TAG}" "${GITHUB_REPOSITORY}"

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "Jupiter ${RELEASE_TAG}" \
              --generate-notes \
              --verify-tag
          fi

          find release-assets -type f -print0 | xargs -0 gh release upload "${RELEASE_TAG}" --clobber
